# La organización y la clave del proyecto se reciben desde GitHub Actions.
sonar.projectName=SIGEP-SIEV Frontend
sonar.sources=src
sonar.sourceEncoding=UTF-8
# Los recursos gráficos no contienen código que deba analizarse.
sonar.exclusions=src/assets/**
# Cuando existan tests con cobertura, agregar sonar.javascript.lcov.reportPaths.
# No se excluye el código de las métricas de cobertura para ocultar tests pendientes.
